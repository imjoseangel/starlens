services:
  starlens:
    build: .
    ports:
      - "${STARLENS_APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - STARLENS_GEMINI_API_KEY=${STARLENS_GEMINI_API_KEY:-}
      - STARLENS_REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
